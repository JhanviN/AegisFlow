services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - aegisflow

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    networks:
      - aegisflow
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic raw-audit-events --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic dlq-compliance-errors --partitions 1 --replication-factor 1
        echo "Topics created"
    networks:
      - aegisflow

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - aegisflow
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aegisflow
      POSTGRES_PASSWORD: aegisflow_secret
      POSTGRES_DB: aegisflow_audit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - aegisflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegisflow -d aegisflow_audit:5432"]
      interval: 5s
      timeout: 5s
      retries: 5

  ml-inference:
    build:
      context: ./ml-inference
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      MODEL_NAME: distilbert-base-uncased-finetuned-conll03-ner
      LOG_LEVEL: info
    networks:
      - aegisflow
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 2G

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      ML_INFERENCE_URL: http://ml-inference:8000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-mock-key-for-dev}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      API_KEYS: ${API_KEYS:-dev-api-key-1,dev-api-key-2}
      RATE_LIMIT_RPM: 6000
      IDEMPOTENCY_TTL_SECONDS: 60
      TX_MAP_TTL_SECONDS: 60
      ML_TIMEOUT_MS: 5000
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      ml-inference:
        condition: service_healthy
    networks:
      - aegisflow

  compliance-worker:
    build:
      context: ./compliance-worker
      dockerfile: Dockerfile
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_GROUP_ID: compliance-worker-group
      KAFKA_TOPIC: raw-audit-events
      KAFKA_DLQ_TOPIC: dlq-compliance-errors
      POSTGRES_URL: postgres://aegisflow:aegisflow_secret@postgres:5432/aegisflow_audit
      BATCH_SIZE: 50
      BATCH_INTERVAL_MS: 2000
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - aegisflow

  redis-exporter:
    image: oliver006/redis_exporter:v1.55.0
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"
    depends_on:
      - redis
    networks:
      - aegisflow

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    command:
      - --kafka.server=kafka:29092
    ports:
      - "9308:9308"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - aegisflow

  prometheus:
    image: prom/prometheus:v2.48.0
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    depends_on:
      - gateway
      - redis-exporter
      - kafka-exporter
    networks:
      - aegisflow

  grafana:
    image: grafana/grafana:10.2.2
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: aegisflow
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - aegisflow

networks:
  aegisflow:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

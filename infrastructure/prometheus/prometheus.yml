global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: aegisflow-gateway
    static_configs:
      - targets: ["gateway:3000"]
    metrics_path: /metrics
    scrape_interval: 5s

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: ml-inference
    static_configs:
      - targets: ["ml-inference:8000"]
    metrics_path: /metrics
    scrape_interval: 30s
